# Local SQL Server for GoFormzDB. Does not replace ts01 — local app uses .env DB_HOST=localhost.
#
# One-off Clearstory sync against ts01 (does not change local .env):
#   cp .env.sync.example .env.sync   # fill ts01 + Clearstory keys
#   docker compose --profile jobs run --rm clearstory-sync

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: trucking-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "trucking@2026"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - trucking-mssql-data:/var/opt/mssql
      - ./GoFormzDB_local.bak:/var/opt/mssql/backup/GoFormzDB_local.bak:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P trucking@2026 -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P trucking@2026 -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Isolated job: writes to whatever DB_HOST is in .env.sync (ts01 by default).
  # Local `npm start` keeps using .env → localhost. First run installs node_modules in a volume.
  clearstory-sync:
    profiles: ["jobs"]
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - clearstory-sync-node-modules:/app/node_modules
    env_file:
      - .env.sync
    environment:
      CRONS_ENABLED: "false"
    command:
      - sh
      - -c
      - |
        if [ ! -x node_modules/.bin/ts-node ]; then npm ci --ignore-scripts; fi
        npm run sync-clearstory-pm-sources-once

volumes:
  trucking-mssql-data:
  clearstory-sync-node-modules:
